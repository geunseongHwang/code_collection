 할많하않."`}},{id:3,type:`number`,theme:`취업`,situation:`자녀가 "일자리가 없다"는 말을 자주 해요.`,question:`2026년 9월, 청년(15~29세) 취업자 수는 몇 개월째 줄고 있을까요?`,options:[`3개월째`,`12개월째`,`47개월째`,`줄지 않았다`],answer:2,explain:`4년 가까이 청년 취업자가 계속 줄고 있어요. 우리 집 자녀만 겪는 일이 아니에요.`,factId:`employed_47m`,sayInstead:`"요즘 일자리가 정말 줄었다더라. 네 탓 아니야."`,word:{word:`무물`,origin:`무엇이든 물어보세요`,meaning:`질문을 받겠다는 뜻`,example:`"오늘 저녁에 엄마한테 무물 해도 돼!"`}},{id:4,type:`phrase`,theme:`쉼`,situation:`퇴사한 자녀가 몇 달째 집에서 쉬고 있어요.`,question:`어떤 말이 자녀에게 더 힘이 될까요?`,options:[`"언제까지 놀 거니?"`,`"쉬는 것도 다음을 위한 준비야. 필요하면 말해."`,`"아무 데나 일단 들어가."`],answer:1,explain:`쉬고 있는 청년 상당수는 원하는 일자리를 못 찾아서 멈춰 있는 경우예요. "논다"는 말은 그 사정을 모른다는 뜻으로 들릴 수 있어요.`,factId:`rest_feeling`,sayInstead:`"쉬는 동안 뭐가 제일 하고 싶어?"`,word:{word:`복세편살`,origin:`복잡한 세상 편하게 살자`,meaning:`복잡한 세상을 편하게 살자는 뜻`,example:`"너무 고민하지 마, 복세편살!"`}},{id:5,type:`number`,theme:`첫 직장`,situation:`자녀가 첫 회사를 1년 반 만에 그만두겠다고 해요.`,question:`요즘 청년의 첫 직장 평균 근속기간은?`,options:[`약 6개월`,`약 1년 6개월`,`약 5년`,`약 10년`],answer:1,explain:`첫 직장을 1~2년 안에 옮기는 게 지금은 평균에 가까워요. 그만둔 이유 1위는 근로여건 불만족이었어요.`,factId:`first_job_tenure`,sayInstead:`"그만두려는 이유가 뭔지 먼저 들어볼게."`,word:{word:`워라밸`,origin:`워크 라이프 밸런스`,meaning:`일과 개인 삶의 균형`,example:`"이 회사는 월급보다 워라밸이 좋아."`}},{id:6,type:`phrase`,theme:`월급`,situation:`자녀가 첫 월급을 받았다며 금액을 알려줬어요.`,question:`가장 좋은 반응은?`,options:[`"그거 받고 어떻게 사니?"`,`"첫 월급 정말 축하해! 고생했다."`,`"옆집 애는 얼마 받는다더라."`],answer:1,explain:`요즘 첫 월급은 200만~300만 원 미만이 가장 많아요. 금액보다 첫 출발을 축하받는 게 자녀에게 오래 남아요.`,factId:`first_wage`,sayInstead:`"첫 월급 축하해! 너한테 먼저 맛있는 거 사 먹어."`,word:{word:`퇴준생`,origin:`퇴사 준비생`,meaning:`취업하자마자 다음 이직·퇴사를 준비하는 직장인`,example:`"나 요즘 퇴준생 모드야."`}},{id:7,type:`number`,theme:`대학`,situation:`자녀가 휴학을 하겠다고 해요.`,question:`요즘 대학 졸업까지 평균 얼마나 걸릴까요?`,options:[`정확히 4년`,`약 4년 6개월`,`약 6년`,`약 3년`],answer:1,explain:`졸업까지 걸리는 기간은 2007년 이후 가장 길어요. 취업·자격시험 준비로 휴학하는 경우가 늘었기 때문이라는 설명이 나왔어요.`,factId:`grad_time`,sayInstead:`"휴학하면 그 시간에 뭘 해보고 싶어?"`,word:{word:`갓생`,origin:`갓(God) + 생(生)`,meaning:`모범적이고 부지런하게, 생활을 스스로 관리하며 사는 삶`,example:`"아침 운동 시작했어. 갓생 살아보려고!"`}},{id:8,type:`phrase`,theme:`시험 준비`,situation:`자녀가 2년째 공무원 시험을 준비하고 있어요.`,question:`어떤 말이 더 힘이 될까요?`,options:[`"그만하고 회사나 들어가."`,`"올해도 떨어지면 어떡하니."`,`"지금까지 버틴 것도 대단해. 필요한 거 있으면 말해."`],answer:2,explain:`취업시험을 준비하는 청년이 60만 명이에요. 혼자만 길어지는 게 아니라는 걸 알면 마음이 조금 덜 무거워요.`,factId:`exam_prep`,sayInstead:`"시험 끝나면 맛있는 거 먹으러 가자."`,word:{word:`독파민`,origin:`독서 + 도파민`,meaning:`책을 읽으며 느끼는 몰입과 재미, 다 읽었을 때의 뿌듯함`,example:`"이 소설 독파민 터진다."`}},{id:9,type:`number`,theme:`집`,situation:`자녀가 독립해서 월세방을 구했다고 해요.`,question:`2026년 1~7월 전체 임대차 거래 중 월세 비중은 얼마일까요?`,options:[`약 20%`,`약 40%`,`약 62%`,`약 90%`],answer:2,explain:`2021년엔 월세가 절반이 안 됐는데, 지금은 거래 10건 중 6건이 넘게 월세예요.`,factId:`monthly_rent`,sayInstead:`"월세 내면서 혼자 사는 거 대견하다."`,word:{word:`1인 가장`,origin:`1인 가구 + 가장`,meaning:`혼자 살며 생활비와 집안일을 모두 스스로 책임진다는 뜻`,example:`"나도 이제 어엿한 1인 가장이야."`}},{id:10,type:`phrase`,theme:`집`,situation:`자녀가 사는 원룸에 처음 가봤는데 생각보다 좁아요.`,question:`어떤 말이 좋을까요?`,options:[`"이런 데서 어떻게 사니?"`,`"혼자 잘 꾸며놨네. 필요한 거 사줄까?"`,`"그냥 집으로 들어와."`],answer:1,explain:`청년가구 1인당 주거면적은 일반가구보다 좁아요. 좁은 집에서 시작하는 게 요즘 청년에게 흔한 현실이에요.`,factId:`small_home`,sayInstead:`"작아도 네 공간이라 좋겠다."`,word:{word:`나와의 혼수`,origin:`나 + 혼수`,meaning:`혼자 쓸 물건을 혼수 고르듯 꼼꼼히 따져 좋은 걸로 사는 것`,example:`"이 냉장고는 나와의 혼수야."`}},{id:11,type:`number`,theme:`쉼`,situation:`뉴스에서 "쉬는 청년"이 많다는 얘기를 들었어요.`,question:`2025년 일도 구직도 하지 않은 20·30대는 몇 명일까요?`,options:[`약 7만 명`,`약 20만 명`,`약 72만 명`,`약 300만 명`],answer:2,explain:`2003년 통계를 만든 뒤 가장 많아요. 한두 집 이야기가 아니에요.`,factId:`rested_717k`,sayInstead:`"요즘 너 같은 친구들 많다더라. 천천히 해."`,word:{word:`쉬었음 청년`,origin:`통계 용어`,meaning:`일도 구직 활동도 하지 않고 스스로 쉬고 있다고 답한 청년`,example:`"뉴스에 쉬었음 청년 얘기 또 나왔어."`}},{id:12,type:`phrase`,theme:`비교`,situation:`친구 자녀가 좋은 회사에 들어갔다는 소식을 들었어요.`,question:`자녀에게 이 소식을 전해야 할까요?`,options:[`"걔는 벌써 들어갔다더라" 하고 바로 전한다`,`굳이 비교하듯 전하지 않는다`,`"너도 분발해" 하며 전한다`],answer:1,explain:`같은 20대 안에서도 출발선 차이가 커요. 비교는 자녀가 바꿀 수 없는 출발선까지 함께 비교하는 말이 될 수 있어요.`,factId:`asset_gap_19`,sayInstead:`"넌 너대로 잘하고 있어."`,word:{word:`사바사`,origin:`사람 바이 사람`,meaning:`사람에 따라 다르다는 뜻`,example:`"그건 사바사지~"`}},{id:13,type:`number`,theme:`구직`,situation:`자녀가 "1년째 지원서만 쓰고 있다"고 해요.`,question:`구직 중인 20대 청년의 평균 구직기간은? (2026년 설문)`,options:[`약 2개월`,`약 6개월`,`약 12개월`,`약 36개월`],answer:2,explain:`1년은 지금 청년들에게 흔한 기간이에요. 30대는 평균 13개월이 넘었어요.`,factId:`search_months`,sayInstead:`"1년 버틴 거 진짜 대단한 거야."`,word:{word:`알잘딱깔센`,origin:`알아서, 잘, 딱, 깔끔하고, 센스 있게`,meaning:`말하지 않아도 눈치껏 잘 처리함`,example:`"이번 일은 알잘딱깔센으로 부탁해!"`}},{id:14,type:`phrase`,theme:`안부`,situation:`혼자 사는 자녀와 연락이 며칠째 뜸해요.`,question:`어떤 연락이 좋을까요?`,options:[`"왜 연락이 없니? 무슨 일 있어?"`,`"반찬 좀 보냈어. 답장 안 해도 돼."`,`연락이 올 때까지 기다린다`],answer:1,explain:`혼자 사는 청년 넷 중 한 명 가까이는 마음이 고립되기 쉬운 상태예요. 부담 없는 안부가 오래 이어지는 연결이 돼요.`,factId:`isolation_single`,sayInstead:`"생각나서 연락했어. 답장은 편할 때 해."`,word:{word:`마상`,origin:`마음의 상처`,meaning:`마음이 다친 상태`,example:`"그 말 듣고 좀 마상이었어."`}},{id:15,type:`number`,theme:`취업`,situation:`자녀 친구들도 취업을 못 했다고 해요.`,question:`2026년 9월 청년 고용률은 얼마일까요?`,options:[`약 24%`,`약 44%`,`약 64%`,`약 84%`],answer:1,explain:`청년 10명 중 일하는 사람이 5명이 안 돼요. 29개월째 떨어지는 중이에요.`,factId:`emp_rate_44`,sayInstead:`"친구들도 다 비슷하구나. 너만 그런 거 아니야."`,word:{word:`케바케`,origin:`케이스 바이 케이스`,meaning:`경우에 따라 다르다는 뜻`,example:`"회사마다 케바케야."`}},{id:16,type:`phrase`,theme:`진로`,situation:`자녀가 회사를 그만두고 배달 일을 하면서 다른 길을 찾겠다고 해요.`,question:`어떤 반응이 좋을까요?`,options:[`"그런 일 하려고 대학 보냈니?"`,`"생각해둔 계획 한번 들려줄래?"`,`"남들 보기 창피하다."`],answer:1,explain:`혼자 일하는 청년 자영업자가 1년 새 2만 4천 명 늘었어요. 많은 청년이 비슷한 선택을 하고 있어요.`,factId:`self_employed`,sayInstead:`"몸 상하지 않게 조심하고, 계획 들려줘."`,word:{word:`스불재`,origin:`스스로 불러온 재앙`,meaning:`자기 행동 때문에 일을 그르침`,example:`"벼락치기는 스불재야…"`}},{id:17,type:`number`,theme:`구직`,situation:`졸업한 자녀가 1년 넘게 일자리를 찾고 있어요.`,question:`졸업 후 1년 넘게 미취업인 청년 비중은? (2026년 5월)`,options:[`약 10%`,`약 25%`,`약 49%`,`약 80%`],answer:2,explain:`미취업 청년 둘 중 한 명꼴이에요. 2009년 금융위기 이후 가장 높아요.`,factId:`unemployed_1y`,sayInstead:`"길어져도 괜찮아. 엄마(아빠)가 기다릴게."`,word:{word:`영크크`,origin:`영(Young) + 크크`,meaning:`요즘 유행을 잘 알고 감각이 살아 있는 사람 (나이와 상관없이)`,example:`"엄마 요즘 완전 영크크네!"`}},{id:18,type:`phrase`,theme:`결혼`,situation:`서른 넘은 자녀에게 결혼 이야기를 꺼내고 싶어요.`,question:`어떤 말이 좋을까요?`,options:[`"올해 안에 누구 데려와."`,`"요즘 어떻게 지내? 너 행복한 게 먼저야."`,`"그러다 혼자 늙는다."`],answer:1,explain:`같은 2030 안에서도 집 마련 여건의 차이가 크게 벌어졌어요. 결혼 시기는 각자 형편과 계획에 따라 달라질 수 있어요.`,factId:`house_gap`,sayInstead:`"네가 원할 때, 원하는 사람이랑 하면 돼."`,word:{word:`개취`,origin:`개인의 취향`,meaning:`개인적인 취향`,example:`"그건 개취니까 존중해 줘."`}},{id:19,type:`number`,theme:`첫 월급`,situation:`자녀 첫 월급이 예상보다 적은 것 같아요.`,question:`요즘 청년 첫 직장 월급으로 가장 많은 구간은?`,options:[`100만 원 미만`,`200만~300만 원 미만`,`400만~500만 원`,`500만 원 이상`],answer:1,explain:`첫 월급은 200만~300만 원 미만이 가장 많고, 150만~200만 원도 넷 중 한 명꼴이에요.`,factId:`first_wage`,sayInstead:`"처음엔 다 그래. 시작한 게 대단한 거야."`,word:{word:`두쫀쿠`,origin:`두바이 쫀득 쿠키`,meaning:`SNS로 알려진 쫀득한 식감의 디저트`,example:`"오는 길에 두쫀쿠 사 갈게!"`}},{id:20,type:`phrase`,theme:`마음`,situation:`자녀가 요즘 사람을 잘 안 만나고 방에만 있어요.`,question:`어떤 말이 좋을까요?`,options:[`"사람 좀 만나고 다녀!"`,`"오늘 저녁 같이 산책할래?"`,`"너 그러다 큰일 난다."`],answer:1,explain:`고립을 겪은 청년 다수는 벗어나고 싶은 마음이 있어요. 다그치기보다 같이 할 작은 일을 제안하는 게 첫걸음이 돼요.`,factId:`isolation_will`,sayInstead:`"엄마(아빠)랑 동네 한 바퀴 걸을래?"`,word:{word:`야르`,origin:`감탄사`,meaning:`기분이 좋을 때 쓰는 말 (앗싸, 야호와 비슷)`,example:`"월급날이다, 야르!"`}},{id:21,type:`number`,theme:`취업`,situation:`"요즘 애들은 눈이 높아서 취업을 안 한다"는 말을 들었어요.`,question:`「쉬었음」 청년(15~29세)이 꼽은 이유 중 "원하는 일자리를 찾기 어려워서"의 비율은?`,options:[`약 3%`,`약 13%`,`약 34%`,`약 90%`],answer:2,explain:`세 명 중 한 명은 원하는 일자리를 찾기 어려워서 쉬고 있다고 답했어요.`,factId:`rested_reason`,sayInstead:`"맞는 자리 찾기가 정말 어렵구나."`,word:{word:`아만보`,origin:`아는 만큼 보인다`,meaning:`알수록 더 잘 보인다는 뜻`,example:`"요즘말도 아만보야!"`}},{id:22,type:`phrase`,theme:`용돈`,situation:`취업 준비 중인 자녀가 용돈 이야기를 꺼내기 어려워해요.`,question:`어떤 방법이 좋을까요?`,options:[`"다 큰 애가 아직도 손 벌리니?"`,`먼저 "이번 달 필요한 거 있어?" 하고 묻는다`,`모른 척한다`],answer:1,explain:`졸업 후 아직 일자리가 없는 청년 중 가장 많은 39.3%가 시험·교육을 준비하며 지내요. 먼저 물어봐 주면 자녀가 덜 미안해해요.`,factId:`jobless_activity`,sayInstead:`"이번 달 필요한 거 있으면 편하게 말해."`,word:{word:`책없쾌`,origin:`책임 없는 쾌락`,meaning:`책임은 남에게 있고 나는 즐거움만 누리는 상태`,example:`"조카랑 놀아주는 건 책없쾌지~"`}},{id:23,type:`number`,theme:`시험 준비`,situation:`자녀 친구들도 다 시험 준비 중이래요.`,question:`취업시험을 준비하는 청년은 몇 명일까요? (2026년 5월)`,options:[`약 6만 명`,`약 20만 명`,`약 60만 명`,`약 200만 명`],answer:2,explain:`60만 명이 시험을 준비 중이에요. 공무원 준비 비중은 22.1%로 다시 늘었어요.`,factId:`exam_prep`,sayInstead:`"같이 준비하는 친구들 있으면 서로 힘이 되겠다."`,word:{word:`스라밸`,origin:`스터디 앤드 라이프 밸런스`,meaning:`공부와 개인 삶의 균형`,example:`"주말엔 쉬어야 스라밸이지."`}},{id:24,type:`phrase`,theme:`집`,situation:`월세가 부담된다는 자녀에게 해줄 수 있는 게 있을까요?`,question:`가장 실질적인 도움은?`,options:[`"그러게 왜 나가 살아."`,`정부 청년월세 지원이 있는지 같이 찾아본다`,`"아껴 쓰면 돼."`],answer:1,explain:`정부 청년월세 지원은 월 최대 20만 원, 최장 24개월이에요. 자격은 소득·재산 기준이 있으니 같이 확인해 보세요.`,factId:`rent_support`,sayInstead:`"청년월세 지원 있다던데, 같이 알아볼까?"`,word:{word:`점메추`,origin:`점심 메뉴 추천`,meaning:`점심 메뉴를 골라 주는 일`,example:`"점메추 해주세요!"`}},{id:25,type:`number`,theme:`대학`,situation:`"대학만 나오면 취업은 된다"고 생각했어요.`,question:`4년제 대졸자 비율은 2020년 59.5%에서 2026년 얼마가 됐을까요?`,options:[`약 40%`,`약 55%`,`약 69%`,`약 95%`],answer:2,explain:`대졸자는 늘었는데 신입 채용은 경력직·수시채용 위주로 바뀌었다는 설명이 나왔어요.`,factId:`four_year`,sayInstead:`"요즘은 대학 나와도 쉽지 않구나."`,word:{word:`별다줄`,origin:`별것을 다 줄인다`,meaning:`온갖 말을 줄여 쓰는 것을 가리킴`,example:`"요즘말 진짜 별다줄이다~"`}},{id:26,type:`phrase`,theme:`퇴사`,situation:`자녀가 "회사 분위기가 너무 힘들다"고 털어놨어요.`,question:`첫마디로 좋은 말은?`,options:[`"다 참고 다니는 거야."`,`"많이 힘들었구나. 무슨 일 있었어?"`,`"그럼 당장 그만둬."`],answer:1,explain:`첫 직장을 그만둔 이유 1위는 근로여건 불만족이에요. 결론부터 말하기보다 먼저 들어주는 게 좋아요.`,factId:`first_job_tenure`,sayInstead:`"얘기해줘서 고마워. 천천히 말해 봐."`,word:{word:`조용한 퇴사`,origin:`Quiet Quitting`,meaning:`회사를 그만두진 않지만 정해진 시간과 업무 안에서만 일하는 태도`,example:`"요즘 조용한 퇴사 중이야."`}},{id:27,type:`number`,theme:`마음`,situation:`요즘 청년들이 외롭다는 기사를 봤어요.`,question:`3개월 넘게 마음이 고립된 청년 비율은 2022년 14.5%에서 2026년 어떻게 됐을까요?`,options:[`5%로 줄었다`,`거의 그대로`,`16.9%로 늘었다`,`50%로 늘었다`],answer:2,explain:`전체 고립 경험은 줄었지만, 오래 고립된 청년은 오히려 늘었어요.`,factId:`isolation_long`,sayInstead:`"요즘 마음은 좀 어때?"`,word:{word:`위쑤시개`,origin:`위(胃) + 이쑤시개`,meaning:`속상한 날 찾는 아주 매운 음식 (속을 콕콕 찌를 만큼 맵다는 뜻)`,example:`"오늘 회사에서 힘들었어. 저녁은 위쑤시개다."`}},{id:28,type:`phrase`,theme:`응원`,situation:`자녀가 면접을 보러 간대요.`,question:`아침에 보낼 문자로 좋은 것은?`,options:[`"이번엔 꼭 붙어라."`,`"떨지 말고 하던 대로 해. 끝나면 맛있는 거 먹자."`,`"떨어지면 어떡하니."`],answer:1,explain:`결과를 짚는 말보다, 끝난 뒤의 작은 즐거움을 약속하는 말이 부담을 덜어줘요.`,factId:`search_months`,sayInstead:`"오늘 하루 수고할 너를 응원해!"`,word:{word:`많관부`,origin:`많은 관심을 부탁드립니다`,meaning:`많이 관심 가져 달라는 부탁`,example:`"제 첫 출근 많관부!"`}},{id:29,type:`number`,theme:`집`,situation:`청년들 집 형편이 어떤지 궁금해요.`,question:`최저주거기준에 못 미치는 집에 사는 청년가구 비율은?`,options:[`약 1%`,`약 8%`,`약 30%`,`약 50%`],answer:1,explain:`청년가구 열두 집 중 한 집꼴이에요. 고시원 등 주택이 아닌 곳에 사는 비율도 있어요.`,factId:`small_home`,sayInstead:`"집에 불편한 거 없어? 고칠 거 있으면 말해."`,word:{word:`완내스`,origin:`완전 내 스타일`,meaning:`아주 내 취향에 맞는다는 뜻`,example:`"이 노래 완내스!"`}},{id:30,type:`phrase`,theme:`마음 전하기`,situation:`자녀 세대 이야기를 여러 장 읽어 봤어요.`,question:`오늘 자녀에게 보내기 가장 좋은 말은?`,options:[`"요즘 애들은 참 편하게 산다."`,`"요즘 너희 세대 힘든 거 조금 알 것 같아. 고생 많다."`,`"우리 땐 더 힘들었어."`],answer:1,explain:`청년 취업자는 4년 가까이 줄고 있어요. "알아준다"는 한마디가 어떤 조언보다 크게 들릴 수 있어요.`,factId:`employed_47m`,sayInstead:`"요즘 너희 세대 정말 고생 많다. 늘 응원해."`,word:{word:`엄미새`,origin:`엄마에 미친 새끼`,meaning:`엄마를 유난히 좋아하고 일상을 함께 나누는 자녀가 스스로를 부르는 친근한 말`,example:`"나 완전 엄미새잖아~ 주말에 엄마랑 데이트!"`}},{id:31,type:`number`,theme:`결혼`,situation:`"요즘 애들은 왜 결혼을 안 하냐"는 이야기를 들었어요.`,question:`미혼 남녀가 꼽은 "결혼하지 않는 이유" 1위는?`,options:[`결혼 생각이 전혀 없어서`,`결혼자금이 부족해서`,`부모님이 반대해서`,`취미 생활 때문에`],answer:1,explain:`마음이 없어서가 아니라 돈이 부족해서라는 답이 가장 많았어요.`,factId:`marriage_reason`,sayInstead:`"결혼은 네가 준비됐을 때 해도 늦지 않아."`,word:{word:`만반잘부`,origin:`만나서 반가워. 잘 부탁해.`,meaning:`처음 만났을 때 하는 인사`,example:`"새로 온 친구야, 만반잘부!"`}},{id:32,type:`number`,theme:`결혼`,situation:`우리 때는 결혼이 당연했는데, 요즘은 다르다고 해요.`,question:`20대 중 결혼을 "해야 한다"고 답한 비율은 2024년에 얼마일까요?`,options:[`약 20%`,`약 40%`,`약 60%`,`약 80%`],answer:1,explain:`10년 전엔 절반이 넘었는데, 지금은 10명 중 4명 정도예요. 전체 국민 평균(52.5%)보다도 낮아요.`,factId:`marriage_should`,sayInstead:`"결혼을 하든 안 하든, 네가 행복한 게 먼저야."`,word:{word:`낄끼빠빠`,origin:`낄 때 끼고 빠질 때 빠져라`,meaning:`모임이나 대화에서 눈치껏 끼고 빠지라는 뜻`,example:`"부모님 대화엔 낄끼빠빠 할게~"`}},{id:33,type:`phrase`,theme:`결혼`,situation:`친척 결혼식에서 돌아오는 길, 미혼인 자녀와 단둘이 차에 탔어요.`,question:`어떤 말이 좋을까요?`,options:[`"너는 언제 국수 먹여줄래?"`,`"오늘 오느라 고생했다. 맛있는 거 먹고 들어갈까?"`,`"사촌 동생도 갔는데 너도 서둘러야지."`],answer:1,explain:`결혼식 다녀온 날은 자녀도 이미 그 생각을 하고 있을 때가 많아요. 결혼하지 않는 이유 1위는 자금 부족이었어요.`,factId:`marriage_reason`,sayInstead:`"오늘 같이 와줘서 고마워."`,word:{word:`동결건조`,origin:`신조어`,meaning:`엄마를 아주 사랑하는 마음을 표현한 말 (불효처럼 들리지만 아니에요)`,example:`"우리 엄마 동결건조!"`}},{id:34,type:`number`,theme:`손주`,situation:`"손주는 언제 보나" 하는 마음이 들어요.`,question:`20대가 생각하는 이상적인 자녀 수로 가장 많은 답은?`,options:[`0명`,`1명`,`2명`,`3명 이상`],answer:2,explain:`아이를 원하지 않는 게 아니에요. 20대도 2명을 가장 많이 꼽았고, 0명은 5.2%뿐이었어요.`,factId:`child_ideal`,sayInstead:`"아이는 너희가 원할 때, 원하는 만큼이면 돼."`,word:{word:`아보하`,origin:`아주 보통의 하루`,meaning:`특별한 일이 없어도 괜찮은, 마음이 편안한 하루`,example:`"오늘은 아보하라서 좋았어."`}},{id:35,type:`number`,theme:`함께 살기`,situation:`서른 넘은 자녀가 아직 집에서 함께 살아요.`,question:`35살에 부모와 함께 산 비율, 1981~86년생은 얼마였을까요?`,options:[`약 5%`,`약 12%`,`약 32%`,`약 70%`],answer:2,explain:`1971~75년생(18.6%)보다 크게 늘었어요. 집값과 월세 부담이 원인으로 꼽혀요.`,factId:`kangaroo_35`,sayInstead:`"같이 사니까 엄마(아빠)는 좋다. 눈치 보지 마."`,word:{word:`전업 자녀`,origin:`전업 + 자녀`,meaning:`부모와 살며 집안 살림과 생활을 맡아 하는 자녀`,example:`"나 요즘 전업 자녀로 집안일 다 해."`}},{id:36,type:`phrase`,theme:`함께 살기`,situation:`직장 다니는 자녀가 독립하지 않고 집에서 출퇴근해요.`,question:`어떤 말이 좋을까요?`,options:[`"돈 벌면 나가 살아야지."`,`"같이 사는 동안 생활비 어떻게 나눌지 한번 얘기해볼까?"`,`"언제까지 얹혀살 거니?"`],answer:1,explain:`경제적으로 독립한 청년도 절반은 부모와 함께 살아요. "나가라"보다 함께 사는 방식을 정하는 대화가 서로 편해요.`,factId:`indep_with_parents`,sayInstead:`"같이 사는 거 엄마(아빠)는 괜찮아. 규칙만 같이 정하자."`,word:{word:`라이프 메이트`,origin:`Life + Mate`,meaning:`법적 가족은 아니지만 함께 살며 생활을 꾸리는 사람`,example:`"내 라이프 메이트랑 같이 장 봤어."`}},{id:37,type:`number`,theme:`월급`,situation:`아르바이트하는 자녀가 시급 이야기를 해요.`,question:`2026년 최저임금(시급)은 얼마일까요?`,options:[`8,720원`,`9,620원`,`10,320원`,`12,000원`],answer:2,explain:`주 40시간 일하면 한 달 약 215만 원이에요. 서울 원룸 월세(평균 64만~71만 원)를 내면 3분의 1 가까이가 집세로 나가요.`,factId:`min_wage`,sayInstead:`"알바하면서 버티는 거 대단하다."`,word:{word:`라을라`,origin:`밈`,meaning:`졸릴 때 쓰는 말 (사무실에서 하품하다 나온 소리에서 유래)`,example:`"점심 먹고 나니 라을라…"`}},{id:38,type:`number`,theme:`집`,situation:`서울에서 자취하는 자녀 월세가 궁금해요.`,question:`2026년 3월 서울 원룸 평균 월세는? (보증금 1,000만 원 기준)`,options:[`약 30만 원`,`약 50만 원`,`약 71만 원`,`약 120만 원`],answer:2,explain:`관리비는 따로 내야 해요. 동네마다 차이가 커서 비싼 곳은 이보다 훨씬 높아요.`,factId:`seoul_rent`,sayInstead:`"월세 감당하느라 고생 많다."`,word:{word:`할렐야루`,origin:`할렐루야 → 할렐야루`,meaning:`기분이 좋을 때 덧붙이는 추임새`,example:`"이번 주 칼퇴 성공, 할렐야루!"`}},{id:39,type:`phrase`,theme:`대학`,situation:`대학생 자녀가 학교 근처 원룸 월세가 너무 비싸다고 해요.`,question:`어떤 말이 좋을까요?`,options:[`"우리 땐 하숙비도 다 냈어."`,`"요즘 방값이 그렇게 올랐구나. 기숙사나 지원 제도도 같이 찾아보자."`,`"그럼 통학해."`],answer:1,explain:`서울 주요 대학가 원룸은 월세와 관리비를 합쳐 평균 70만 원이 넘어요.`,factId:`campus_rent`,sayInstead:`"방값 걱정은 같이 하자."`,word:{word:`트민남·트민녀`,origin:`트렌드에 민감한 남자·여자`,meaning:`새로운 유행을 남보다 빨리 알아보고 즐기는 사람`,example:`"우리 아빠 완전 트민남이네?"`}},{id:40,type:`number`,theme:`쉼`,situation:`"그냥 쉬는 청년"이 많다는 뉴스를 봤어요.`,question:`2026년 2월, 그냥 쉬었다는 청년(15~29세)은 10년 전보다 어떻게 됐을까요?`,options:[`절반으로 줄었다`,`비슷하다`,`2배로 늘었다`,`10배로 늘었다`],answer:2,explain:`10년 전 24만 명에서 48만 5천 명으로 늘었어요. 쉬는 청년의 상당수는 원하는 일자리를 찾기 어려웠다고 답했어요.`,factId:`rested_double`,sayInstead:`"쉬는 동안 몸이랑 마음 잘 챙겨."`,word:{word:`샤갈`,origin:`유튜브 밈`,meaning:`어이없거나 당황스러울 때 쓰는 말`,example:`"버스 놓쳤어, 샤갈…"`}},{id:41,type:`number`,theme:`출발선`,situation:`"노력하면 다 된다"고 말해주고 싶어요.`,question:`청년들이 "부모 소득이 대물림되는 정도"를 10점 만점에 평균 몇 점으로 봤을까요?`,options:[`약 3점`,`약 5점`,`약 7점`,`약 10점`],answer:2,explain:`청년 다수는 출발선 차이가 크다고 느껴요. "노력하면 된다"는 말이 "네 노력이 부족했다"로 들릴 수 있어요.`,factId:`inherit_view`,sayInstead:`"출발이 다를 수 있어. 너는 네 속도대로 잘하고 있어."`,word:{word:`엔믹스하다`,origin:`K팝 밈`,meaning:`갑자기 상황이 바뀌거나 태세를 전환할 때 쓰는 말`,example:`"계획이 갑자기 엔믹스됐어."`}},{id:42,type:`phrase`,theme:`돈`,situation:`자녀가 카드값 때문에 힘들다고 털어놨어요.`,question:`첫 반응으로 좋은 것은?`,options:[`"헤프게 쓰니까 그렇지."`,`"말해줘서 고마워. 얼마나 되는지 같이 정리해보자."`,`"알아서 해결해."`],answer:1,explain:`빚 문제로 상담받은 청년 상당수는 처음 빚을 진 이유로 생활비를 꼽았어요. 혼내기보다 먼저 들어주면 자녀가 숨기지 않아요.`,factId:`debt_living`,sayInstead:`"혼자 끙끙 앓지 말고 같이 방법 찾자."`,word:{word:`저메추`,origin:`저녁 메뉴 추천`,meaning:`저녁 메뉴를 추천해 달라는 말`,example:`"엄마 저메추 해줘~"`}},{id:43,type:`phrase`,theme:`세대 차이`,situation:`"우리 땐 더 힘들었다"는 말이 목까지 차올라요.`,question:`어떻게 하면 좋을까요?`,options:[`그대로 말한다`,`"너희 때는 너희대로 힘든 게 있구나"라고 말한다`,`아무 말도 안 하고 자리를 뜬다`],answer:1,explain:`힘듦은 비교할 수 없어요. 결혼을 바라보는 생각도 세대마다 다르고, 그 차이를 인정하는 데서 대화가 시작돼요.`,factId:`marriage_all`,sayInstead:`"너희 때는 너희대로 힘든 게 있지."`,word:{word:`늙크크`,origin:`늙 + 크크`,meaning:`유행을 잘 모르거나 예전 감성인 자신을 장난스럽게 부르는 말`,example:`"나 이 노래 모르는 거 보니 늙크크인가 봐."`}},{id:44,type:`word`,theme:`요즘말`,situation:`자녀가 카톡으로 사진과 함께 「느좋」이라고 보냈어요.`,question:`「느좋」은 무슨 뜻일까요?`,options:[`느리지만 좋다`,`느낌이 좋다`,`느긋하게 좋다`,`느끼해서 좋다`],answer:1,explain:`「느좋」은 "느낌 좋은"을 줄인 말이에요. 분위기나 물건이 마음에 들 때 써요.`,sayInstead:`"사진 느좋이다!" 하고 답장해 보세요.`,word:{word:`느좋`,origin:`느낌 좋은`,meaning:`분위기나 느낌이 좋다는 뜻`,example:`"이 카페 완전 느좋!"`}},{id:45,type:`word`,theme:`요즘말`,situation:`자녀가 "이번 주말에 이거 같이 해줄 수 있어?" 하고 물어요. 「쌉가능」이라고 답해 볼까요?`,question:`「쌉가능」은 무슨 뜻일까요?`,options:[`조금 어렵다`,`절대 안 된다`,`충분히 할 수 있다`,`나중에 하겠다`],answer:2,explain:`「쌉가능」은 "가능하다"를 강하게 말하는 표현이에요. "물론이지!"와 같아요.`,sayInstead:`"엄마(아빠)는 쌉가능이지!"`,word:{word:`쌉가능`,origin:`쌉 + 가능`,meaning:`충분히 할 수 있다는 뜻을 강하게 나타내는 말`,example:`"그 정도는 쌉가능!"`}},{id:46,type:`word`,theme:`요즘말`,situation:`자녀가 정신없는 하루였다며 「난리자베스」라고 했어요.`,question:`「난리자베스」는 어떤 상황에 쓸까요?`,options:[`아주 정신없을 때`,`여행 갈 때`,`배고플 때`,`기분이 좋을 때`],answer:0,explain:`「난리」와 「엘리자베스」를 섞은 말로, 상황이 어지럽고 정신없을 때 웃으며 쓰는 표현이에요.`,sayInstead:`"오늘 난리자베스였구나. 푹 쉬어."`,word:{word:`난리자베스`,origin:`난리 + 엘리자베스`,meaning:`상황이 매우 어지럽고 정신없다는 뜻`,example:`"오늘 회사 완전 난리자베스!"`}},{id:47,type:`word`,theme:`요즘말`,situation:`노래 경연 프로그램을 보던 자녀가 「폼 미쳤다」고 외쳤어요.`,question:`「폼 미쳤다」는 무슨 뜻일까요?`,options:[`정신이 이상하다`,`정말 대단하다`,`자세가 불편하다`,`옷이 이상하다`],answer:1,explain:`여기서 「미쳤다」는 나쁜 뜻이 아니라 "정말 대단하다"는 감탄이에요.`,sayInstead:`"오늘 너 폼 미쳤다!" 하고 칭찬해 보세요.`,word:{word:`폼미쳤다`,origin:`폼(Form) + 미쳤다`,meaning:`모습이나 실력이 정말 대단하다는 감탄`,example:`"이번 무대 폼미쳤다!"`}},{id:48,type:`word`,theme:`요즘말`,situation:`버스를 놓친 자녀가 「럭키비키」라고 웃었어요.`,question:`「럭키비키」는 어떤 마음일까요?`,options:[`안 좋은 일도 좋게 보는 마음`,`운이 나빠 속상한 마음`,`화가 난 마음`,`귀찮은 마음`],answer:0,explain:`안 좋은 일이 생겨도 "오히려 좋아"라고 긍정적으로 받아들이는 표현이에요.`,sayInstead:`"그래, 럭키비키다!" 하고 같이 웃어 주세요.`,word:{word:`럭키비키`,origin:`럭키(Lucky) + 비키(Vicky)`,meaning:`안 좋은 일도 긍정적으로 받아들이는 태도`,example:`"비 와서 집에 있으니 럭키비키!"`}},{id:49,type:`word`,theme:`요즘말`,situation:`자녀가 친구 사진에 「갓벽」이라고 댓글을 달았어요.`,question:`「갓벽」은 무슨 뜻일까요?`,options:[`갓 만든 벽`,`흠잡을 데 없이 완벽하다`,`조금 아쉽다`,`오래됐다`],answer:1,explain:`신(God)과 「완벽」을 합친 말로, 더할 나위 없이 뛰어나다는 칭찬이에요.`,sayInstead:`"오늘 네 모습 갓벽하다!"`,word:{word:`갓벽`,origin:`갓(God) + 완벽`,meaning:`신이 빚은 것처럼 완벽하다는 칭찬`,example:`"엄마 김장 갓벽!"`}},{id:50,type:`word`,theme:`요즘말`,situation:`딸이 "나는 아미새야"라고 해요.`,question:`「아미새」는 무슨 뜻일까요?`,options:[`아빠를 유난히 좋아하는 자녀`,`아침에 일찍 일어나는 새`,`아무 말이나 하는 사람`,`아이를 좋아하는 사람`],answer:0,explain:`「아빠에 미친 새끼」를 줄인 말로, 거칠게 들리지만 아빠를 유난히 좋아하는 자녀가 스스로를 부르는 애칭이에요.`,sayInstead:`"아빠도 너한테 아미새 될게."`,word:{word:`아미새`,origin:`아빠에 미친 새끼`,meaning:`아빠를 유난히 좋아하는 자녀의 친근한 애칭 (엄미새의 아빠 버전)`,example:`"나 완전 아미새야~"`}},{id:51,type:`phrase`,theme:`칭찬`,situation:`자녀가 오랜만에 집에 와서 설거지를 해줬어요.`,question:`어떤 말이 좋을까요?`,options:[`"웬일이니? 해가 서쪽에서 뜨겠다."`,`"고마워. 덕분에 엄마(아빠)가 편히 쉰다."`,`"설거지는 이렇게 하는 거 아니야."`],answer:1,explain:`고마움은 고마움으로만 돌려주는 게 좋아요. 다음에도 또 하고 싶어져요.`,sayInstead:`"고마워, 덕분에 쉰다."`,word:{word:`아자스`,origin:`아리가토 고자이마스(일본어)의 줄임`,meaning:`고마울 때 가볍게 쓰는 말`,example:`"설거지 해줘서 아자스~"`}},{id:52,type:`phrase`,theme:`안부`,situation:`자녀가 요즘 회사 일로 바빠서 연락이 줄었어요.`,question:`어떤 문자가 좋을까요?`,options:[`"부모 잊었니?"`,`"바쁘지? 밥 잘 챙겨 먹어. 답장은 안 해도 돼."`,`"왜 전화 안 받아?"`],answer:1,explain:`답장을 재촉하지 않는 짧은 안부가 오래 이어져요. 혼자 사는 청년 넷 중 한 명 가까이는 마음이 고립되기 쉬운 상태라는 조사도 있어요.`,factId:`isolation_single`,sayInstead:`"오늘도 수고했어. 답장은 편할 때."`,word:{word:`뽀시래기`,origin:`부스러기(방언)`,meaning:`작고 귀여워 바라만 봐도 마음이 가는 존재`,example:`"우리 집 강아지 뽀시래기 같아."`}},{id:53,type:`phrase`,theme:`첫인사`,situation:`자녀가 애인을 처음 집에 데려왔어요.`,question:`첫마디로 좋은 것은?`,options:[`"무슨 일 하세요? 연봉은요?"`,`"반가워요. 먼 길 오느라 고생했어요."`,`"부모님은 뭐 하시고?"`],answer:1,explain:`첫 만남에서 직업·돈·집안을 묻는 말은 평가받는 느낌을 줘요. 결혼을 망설이는 이유 1위가 결혼자금이라 더 예민한 이야기예요.`,factId:`marriage_reason`,sayInstead:`"와줘서 고마워요. 편하게 있다 가요."`,word:{word:`갑툭튀`,origin:`갑자기 툭 튀어나오다`,meaning:`미리 알릴 틈 없이 불쑥 나타나는 상황`,example:`"비가 갑툭튀했네."`}}],d={employed_47m:{id:`employed_47m`,text:`2026년 9월 청년(15~29세) 취업자는 341만 7천 명으로 1년 전보다 14만 7천 명 줄었어요. 47개월째 줄고 있어요.`,source:`국가데이터처 「2026년 9월 고용동향」(2026.10.16)`,url:`https://www.fnnews.com/news/202610190606375667`},emp_rate_44:{id:`emp_rate_44`,text:`2026년 9월 청년 고용률은 44.0%로 29개월 연속 떨어졌어요. 청년 실업률 5.4%는 같은 달 기준 4년 만에 가장 높아요.`,source:`국가데이터처 「2026년 9월 고용동향」(2026.10.16)`,url:`https://www.fnnews.com/news/202610190606375667`},unemployed_1y:{id:`unemployed_1y`,text:`졸업 후 1년 넘게 일자리를 못 구한 청년 비중은 48.6%(60만 5천 명)로, 2009년 금융위기 이후 가장 높아요. 3년 이상도 19.4%예요.`,source:`국가데이터처 「2026년 5월 청년층 부가조사」(2026.7.23)`,url:`https://www.imaeil.com/page/view/2026072314274406708`},grad_time:{id:`grad_time`,text:`대학 졸업까지 평균 4년 5.7개월이 걸려요. 2007년 이후 가장 길어요.`,source:`국가데이터처 「2026년 5월 청년층 부가조사」(2026.7.23)`,url:`https://www.imaeil.com/page/view/2026072314274406708`},first_job_time:{id:`first_job_time`,text:`졸업 후 첫 직장(임금근로)을 구하기까지 평균 11.2개월이 걸려요.`,source:`국가데이터처 「2026년 5월 청년층 부가조사」(2026.7.23)`,url:`https://www.korea.kr/news/policyNewsView.do?newsId=156771847`},first_job_tenure:{id:`first_job_tenure`,text:`첫 직장 평균 근속기간은 1년 6.8개월이에요. 그만둔 이유 1위는 근로여건 불만족(44.4%)이에요.`,source:`국가데이터처 「2026년 5월 청년층 부가조사」(2026.7.23)`,url:`https://www.imaeil.com/page/view/2026072314274406708`},first_wage:{id:`first_wage`,text:`첫 직장 월급은 200만~300만 원 미만이 42.1%로 가장 많고, 150만~200만 원 미만이 23.3%예요.`,source:`국가데이터처 「2026년 5월 청년층 부가조사」(2026.7.23)`,url:`https://www.mt.co.kr/economy/2026/07/23/2026072308421586967`},jobless_activity:{id:`jobless_activity`,text:`졸업 후 아직 일자리가 없는 청년의 39.3%는 직업교육·취업시험을 준비하고 있어요.`,source:`국가데이터처 「2026년 5월 청년층 부가조사」(2026.7.23)`,url:`https://www.korea.kr/news/policyNewsView.do?newsId=156771847`},exam_prep:{id:`exam_prep`,text:`취업시험을 준비하는 청년은 60만 명이에요. 일반기업 34.0%, 일반직 공무원 22.1% 순이에요.`,source:`국가데이터처 「2026년 5월 청년층 부가조사」(2026.7.23)`,url:`https://www.imaeil.com/page/view/2026072314274406708`},rested_717k:{id:`rested_717k`,text:`2025년 일도 구직도 하지 않은 20·30대 「쉬었음」 인구는 71만 7천 명으로 2003년 통계 작성 이후 가장 많았어요.`,source:`국가데이터처 「2025년 연간 고용동향」`,url:`https://www.nocutnews.co.kr/news/6457693`},rested_reason:{id:`rested_reason`,text:`「쉬었음」이라고 답한 15~29세의 34.1%는 "원하는 일자리를 찾기 어려워서"라고 답했어요.`,source:`국가데이터처 조사(2025년 8월), 경향신문 보도`,url:`https://www.khan.co.kr/article/202601181148001/`},search_months:{id:`search_months`,text:`구직 중인 청년의 평균 구직기간은 20대 12.1개월, 30대 13.2개월이었어요.`,source:`서울신문·사람인 설문(청년 1,074명, 2026.7)`,url:`https://m.seoul.co.kr/news/2026/07/17/20260717002002`},rest_feeling:{id:`rest_feeling`,text:`"쉬었다"고 답한 청년이 꼽은 이유 1위는 "정규 일자리에 취업하지 못해서"(20대 78.2%)였어요.`,source:`서울신문·사람인 설문(청년 1,074명, 2026.7)`,url:`https://m.seoul.co.kr/news/2026/07/16/20260716500251`},asset_gap_19:{id:`asset_gap_19`,text:`같은 20대 안에서도 순자산 격차가 19배예요. 30대(5.5배), 50대(8.5배)보다 훨씬 커요.`,source:`KDI 「나라경제」 2026년 7월호`,url:`https://bravo.etoday.co.kr/view/atc_view/19647`},house_gap:{id:`house_gap`,text:`2030세대 상·하위 20%의 부동산자산 격차는 2024년 74.4배에서 2025년 121.6배로 커졌어요.`,source:`KDI 「나라경제」 2026년 7월호`,url:`https://bravo.etoday.co.kr/view/atc_view/19647`},monthly_rent:{id:`monthly_rent`,text:`월세 거래 비중이 2021년 42.3%에서 2026년 1~7월 61.8%로 늘었어요. (청년만이 아닌 전체 임대차 시장 기준)`,source:`국토교통부 실거래 통계(보도 인용)`,url:`https://news.jkn.co.kr/post/963095`},small_home:{id:`small_home`,text:`청년가구의 8.2%가 최저주거기준에 못 미치는 집에 살아요. 1인당 주거면적도 31.1㎡로 일반가구(36.0㎡)보다 좁아요.`,source:`국토교통부 주거실태조사(2025년 11월 발표)`,url:`https://www.imaeil.com/page/view/2025111611373417953`},rent_support:{id:`rent_support`,text:`정부 청년월세 지원은 월 최대 20만 원, 최장 24개월이에요.`,source:`국토교통부(보도 인용)`,url:`https://www.insight.co.kr/news/550088`},isolation_long:{id:`isolation_long`,text:`3개월 넘게 마음이 고립된 청년 비율은 2022년 14.5%에서 2026년 16.9%로 늘었어요.`,source:`사단법인 오늘은 「2026 청년세대 고립보고서」`,url:`https://futurechosun.com/?p=151109`},isolation_will:{id:`isolation_will`,text:`고립을 겪은 청년의 60.3%는 "적극적으로 벗어나려는 의지가 있다"고 답했어요. 고립을 겪지 않은 청년 중 "그들에게 의지가 있을 것"이라 본 비율은 41.2%였어요.`,source:`사단법인 오늘은 「2026 청년세대 고립보고서」`,url:`https://futurechosun.com/?p=151109`},isolation_single:{id:`isolation_single`,text:`혼자 사는 청년의 23.5%가 정서적 고립 고위험군이었어요.`,source:`사단법인 오늘은 「2026 청년세대 고립보고서」`,url:`https://futurechosun.com/archives/tag/청년세대고립보고서`},self_employed:{id:`self_employed`,text:`직원 없이 혼자 일하는 15~29세 자영업자가 13만 4천 명으로 1년 새 2만 4천 명 늘었어요. 배달·택배 쪽이 많아요.`,source:`국가데이터처 「2026년 8월 비임금근로 부가조사」(2026.11.4)`,url:`https://newstomato.com/ReadNews.aspx?no=1319309`},four_year:{id:`four_year`,text:`4년제 대졸자 비율이 2020년 59.5%에서 2026년 69.3%로 올랐어요. 경력직 선호와 수시채용 때문에 신입 문이 좁아졌다는 설명도 나왔어요.`,source:`국가데이터처 고용통계과장 설명(2026.7.23)`,url:`https://www.imaeil.com/page/view/2026072314274406708`},marriage_should:{id:`marriage_should`,text:`20대 중 결혼을 "해야 한다"고 답한 비율은 2014년 51.2%에서 2024년 39.7%로 줄었어요.`,source:`통계청 「2024년 사회조사」`,url:`https://www.segye.com/newsView/20241125516377`},marriage_reason:{id:`marriage_reason`,text:`미혼 남녀가 결혼하지 않는 이유 1위는 "결혼자금이 부족해서"였어요.`,source:`통계청 「2024년 사회조사」`,url:`https://biz.sbs.co.kr/amp/article/20000201186`},marriage_all:{id:`marriage_all`,text:`전체 국민 중 "결혼을 해야 한다"는 응답은 52.5%였어요. 20대만 보면 39.7%예요.`,source:`통계청 「2024년 사회조사」`,url:`https://www.fnnews.com/news/202411121410156289`},child_ideal:{id:`child_ideal`,text:`20대가 생각하는 이상적인 자녀 수는 2명(60.4%)이 가장 많았고, 1명(30.2%), 0명(5.2%) 순이었어요.`,source:`통계청 「2024년 사회조사」`,url:`https://www.segye.com/newsView/20241125516377`},kangaroo_35:{id:`kangaroo_35`,text:`35살에 부모와 함께 산 비율이 1971~75년생은 18.6%였는데, 1981~86년생은 32.1%였어요.`,source:`서울연구원 「서울시민 생애과정 변화와 빈곤 위험」(서울신문 보도, 2026.6)`,url:`https://www.seoul.co.kr/news/economy/2026/06/01/20260601002002`},indep_with_parents:{id:`indep_with_parents`,text:`2024년 기준, 경제적으로 독립한 청년의 절반은 부모와 함께 살고 있었어요.`,source:`한국고용정보원 「고용동향브리프 2026년 제5호」`,url:`https://www.segye.com/newsView/20260810504771`},min_wage:{id:`min_wage`,text:`2026년 최저임금은 시급 1만 320원, 주 40시간 기준 월 215만 6,880원이에요.`,source:`고용노동부 최저임금 고시`,url:`https://www.bizforms.co.kr/guide365/162`},seoul_rent:{id:`seoul_rent`,text:`2026년 3월 서울 원룸(33㎡ 이하) 평균 월세는 보증금 1,000만 원 기준 71만 원이었어요.`,source:`다방, 국토교통부 실거래가 분석(2026.4)`,url:`https://www.fnnews.com/news/202604230939485753`},gangnam_rent:{id:`gangnam_rent`,text:`2026년 6월 서울 원룸 평균 월세는 64만 원, 강남구는 102만 원으로 서울 평균의 1.6배였어요.`,source:`다방, 국토교통부 실거래가 분석(2026.7)`,url:`https://www.insight.co.kr/news/565003`},campus_rent:{id:`campus_rent`,text:`서울 주요 대학가 원룸 평균 월세는 62만 2천 원, 관리비까지 더하면 70만 4천 원이에요.`,source:`다방 분석(2026년 1월 기준)`,url:`https://v.daum.net/v/20260224190250832`},rested_double:{id:`rested_double`,text:`2026년 2월 "그냥 쉬었다"는 청년(15~29세)은 48만 5천 명으로, 10년 전(24만 명)의 2배예요.`,source:`국가데이터처 「2026년 2월 고용동향」(이코노미스트 보도)`,url:`https://v.daum.net/v/20260330063253631?f=p`},inherit_view:{id:`inherit_view`,text:`청년들은 "부모 소득이 자녀에게 대물림되는 정도"를 10점 만점에 평균 7.23점으로 봤어요.`,source:`「2024년 청년 삶 실태조사」(보건복지포럼 2026.10)`,url:`https://www.kihasa.re.kr/api/kihasa/file/download?seq=34731`},debt_living:{id:`debt_living`,text:`빚 문제로 개인회생을 신청한 29세 이하 청년 중 67.9%는 처음 빚을 진 이유로 "생활비 마련"을 꼽았어요.`,source:`서울금융복지상담센터 조사(머니투데이 2026.5)`,url:`https://www.mt.co.kr/policy/2026/05/12/2026051209471446502`}},f={취업:`💼`,명절:`🧧`,쉼:`🛋️`,"첫 직장":`🏢`,월급:`💰`,"첫 월급":`💵`,대학:`🎓`,"시험 준비":`📚`,집:`🏠`,비교:`⚖️`,구직:`🔎`,안부:`📱`,진로:`🧭`,결혼:`💍`,마음:`💛`,용돈:`👛`,퇴사:`🚪`,응원:`📣`,"마음 전하기":`💌`,손주:`👶`,"함께 살기":`🏡`,출발선:`🏁`,돈:`💳`,"세대 차이":`🔁`,요즘말:`💬`,칭찬:`👏`,첫인사:`🤝`};function p(e){return f[e]??`📖`}var m={lang:void 0,message:void 0,abortEarly:void 0,abortPipeEarly:void 0};function h(e){return e?{lang:e?.lang??void 0,message:e?.message,abortEarly:e?.abortEarly??void 0,abortPipeEarly:e?.abortPipeEarly??void 0}:m}function g(e){let t=typeof e;return t===`string`?`"${e}"`:t===`number`||t===`bigint`||t===`boolean`?`${e}`:t===`object`||t===`function`?(e&&Object.getPrototypeOf(e)?.constructor?.name)??`null`:t}function _(e,t,n,r,i){let a=i&&`input`in i?i.input:n.value,o=i?.expected??e.expects??null,s=i?.received??g(a),c={kind:e.kind,type:e.type,input:a,expected:o,received:s,message:`Invalid ${t}: ${o?`Expected ${o} but r`:`R`}eceived ${s}`,requirement:e.requirement,path:i?.path,issues:i?.issues,lang:r.lang,abortEarly:r.abor
